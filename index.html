<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="referrer" content="no-referrer">
<title>생각</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #111827; font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; -webkit-text-size-adjust: 100%; }
  header { padding: calc(14px + env(safe-area-inset-top)) 20px 10px; font-size: 20px; font-weight: 700; }
  main { padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }
  .note { font-size: 14px; padding: 10px 12px; border-radius: 8px; }
  .ok { background: #f5f3ff; color: #6d28d9; }
  .err { background: #fef2f2; color: #b91c1c; }
  textarea { width: 100%; height: 96px; border: 1px solid #d1d5db; border-radius: 10px; padding: 14px; font: inherit; font-size: 17px; line-height: 1.5; resize: none; outline: none; }
  textarea:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px #ede9fe; }
  textarea::placeholder { color: #9ca3af; }
  button.go { height: 52px; border: 0; border-radius: 10px; background: #7c3aed; color: #fff; font: inherit; font-size: 17px; font-weight: 600; }
  button.go:disabled { background: #c4b5fd; }
  .today { margin-top: 16px; border-top: 8px solid #f3f4f6; padding: 10px 20px calc(24px + env(safe-area-inset-bottom)); font-size: 14px; }
  .th { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 15px; padding: 4px 0 6px; }
  .th button { border: 0; background: none; color: #6b7280; font-size: 18px; padding: 4px 8px; }
  .grp { font-size: 12px; color: #6b7280; margin: 10px 0 2px; }
  .grp b { color: #374151; }
  .li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #f3f4f6; }
  .tm { width: 44px; flex: none; font-variant-numeric: tabular-nums; color: #b45309; font-weight: 600; }
  .tt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .tt small { display: block; color: #9ca3af; font-size: 12px; }
  .dot { width: 7px; height: 7px; margin: 0 4px; flex: none; background: #7c3aed; border-radius: 50%; }
  .done .tt { color: #9ca3af; text-decoration: line-through; }
  .done .dot { background: #d1d5db; }
  .done .tm { color: #9ca3af; }
  .late { color: #dc2626; font-size: 12px; font-weight: 600; flex: none; }
  .dd { color: #9ca3af; font-size: 12px; flex: none; }
  .who { font-size: 12px; color: #c2410c; background: #fff7ed; border-radius: 4px; padding: 1px 6px; flex: none; }
  .empty { color: #9ca3af; padding: 18px 0; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>생각</header>
<main>
  <div id="note" class="note" hidden></div>
  <textarea id="text" placeholder="생각 적고 넣기" maxlength="1000" enterkeyhint="send" aria-label="생각"></textarea>
  <button id="go" class="go" disabled>넣기</button>
</main>
<section id="today" class="today" hidden>
  <div class="th"><span id="day">오늘</span><button id="reload" aria-label="새로 읽기">↻</button></div>
  <div id="list"></div>
</section>
<script>
  // 휴대폰 생각 넣기·오늘 보기 (paek4.0 자료/휴대폰 생각 넣기 계획서.md 3판, 화면안 4~8)
  // 비밀 값은 연결 QR 주소의 #key= 로 한 번 받아 이 휴대폰에만 저장한다. 오늘 목록은 저장하지 않는다
  const API = "https://pqntjdjdbmjfbutocxym.supabase.co/functions/v1/thought-inbox"
  const $ = (id) => document.getElementById(id)
  const text = $("text"), go = $("go"), note = $("note")
  const store = {
    get: (k) => { try { return localStorage.getItem(k) } catch { return null } },
    set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch {} },
  }

  // 연결: 주소의 키를 저장하고 주소에서 지운다
  const fromLink = new URLSearchParams(location.hash.slice(1)).get("key")
  if (fromLink) {
    store.set("key", fromLink)
    history.replaceState(null, "", location.pathname)
  }
  const key = () => store.get("key")

  let noteTimer
  function show(kind, msg, ms) {
    clearTimeout(noteTimer)
    note.className = "note " + kind
    note.textContent = msg
    note.hidden = !msg
    if (ms) noteTimer = setTimeout(() => (note.hidden = true), ms)
  }
  let sending = false
  let broken = false
  const ready = () => (go.disabled = broken || !key() || !text.value.trim() || sending)
  function cut() {
    broken = true
    show("err", "연결이 끊김 · PC에서 QR을 다시 찍어 주세요")
    go.textContent = "넣기"
    $("today").hidden = true
    ready()
  }

  // 쓰던 글은 앱을 닫아도 남는다(성공해야 지운다)
  text.value = store.get("draft") ?? ""
  text.addEventListener("input", () => {
    store.set("draft", text.value)
    if (store.get("pendingText") !== text.value) go.textContent = "넣기"
    ready()
  })

  async function send() {
    const content = text.value.trim()
    if (go.disabled) return
    // 같은 글을 다시 보내면 같은 ID → 두 번 들어가지 않는다
    let id = store.get("pendingId")
    if (!id || store.get("pendingText") !== text.value) {
      id = crypto.randomUUID()
      store.set("pendingId", id)
      store.set("pendingText", text.value)
    }
    sending = true
    ready()
    try {
      const r = await fetch(API, {
        method: "POST",
        headers: { "content-type": "application/json", "x-inbox-key": key() },
        body: JSON.stringify({ id, content }),
      })
      if (r.status === 401) return cut()
      if (!r.ok) throw new Error(String(r.status))
      for (const k of ["draft", "pendingId", "pendingText"]) store.set(k, null)
      text.value = ""
      go.textContent = "넣기"
      show("ok", "생각에 넣음", 2500)
      if ($("list").querySelector(".empty")) loadToday() // 끊겼다 돌아왔으면 오늘 목록도 다시
    } catch {
      show("err", "못 넣음 · 인터넷 연결을 확인해 주세요")
      go.textContent = "다시 보내기"
    } finally {
      sending = false
      ready()
    }
  }
  go.addEventListener("click", send)
  text.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault()
      send()
    }
  })

  // 오늘 보기: 열 때·돌아올 때·↻ (보기만)
  const WEEK = "일월화수목금토"
  const el = (tag, cls, txt) => {
    const n = document.createElement(tag)
    if (cls) n.className = cls
    if (txt != null) n.textContent = txt
    return n
  }
  const days = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5)
  function row(cls, lead, title, sub, tail) {
    const li = el("div", "li" + (cls ? " " + cls : ""))
    const tt = el("span", "tt", title)
    if (sub) tt.append(el("small", null, sub))
    li.append(lead, tt)
    if (tail) li.append(tail)
    return li
  }
  const dueTail = (due, today, done) =>
    !done && due < today ? el("span", "late", `${days(due, today)}일 지남`) : el("span", "dd", "오늘")

  async function loadToday() {
    if (!key() || broken) return
    const list = $("list")
    $("today").hidden = false
    try {
      const r = await fetch(API, { headers: { "x-inbox-key": key() }, cache: "no-store" })
      if (r.status === 401) return cut()
      if (!r.ok) throw new Error(String(r.status))
      const d = await r.json()
      const [y, m, dd] = d.today.split("-").map(Number)
      $("day").textContent = `오늘 · ${m}/${dd} (${WEEK[new Date(y, m - 1, dd).getDay()]})`
      const out = []
      const grp = (name, n) => {
        const g = el("div", "grp", name + " ")
        g.append(el("b", null, String(n)))
        out.push(g)
      }
      grp("오늘 일정", d.appts.length)
      for (const a of d.appts) out.push(row(a.done ? "done" : "", el("span", "tm", a.time), a.title, a.sub))
      grp("오늘 할 일", d.tasks.length)
      for (const t of d.tasks) out.push(row(t.done ? "done" : "", el("span", "dot"), t.title, t.sub, dueTail(t.due, d.today, t.done)))
      if (d.delegated.length) {
        grp("위임 · 오늘 마감", d.delegated.length)
        for (const t of d.delegated) out.push(row("", el("span", "who", t.who || "위임"), t.title, "", dueTail(t.due, d.today, false)))
      }
      list.replaceChildren(...out)
    } catch {
      list.replaceChildren(el("div", "empty", "오늘 목록을 불러오지 못함"))
    }
  }
  $("reload").addEventListener("click", loadToday)
  document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && loadToday())

  if (!key()) cut()
  else {
    if (fromLink) show("ok", "연결됨", 4000)
    ready()
    loadToday()
  }
</script>
</body>
</html>
